name: Build new-api image for server

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: feature/20261122-develop
        type: string
      architecture:
        description: Match uname -m on the production server
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
      deploy:
        description: Deploy the published image to production through SSH
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: new-api-ghcr-publish
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - id: meta
        name: Resolve immutable source revision
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          IMAGE="ghcr.io/${REPOSITORY,,}"
          TAG="sha-${SHA:0:12}-${TARGET_ARCH}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    outputs:
      image_ref: ${{ needs.resolve.outputs.image }}@${{ steps.build.outputs.digest }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write build version
        env:
          VERSION: ${{ needs.resolve.outputs.tag }}
        run: printf '%s\n' "$VERSION" > VERSION
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ inputs.architecture }}
          push: true
          tags: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
          cache-from: type=gha,scope=new-api-${{ inputs.architecture }}
          cache-to: type=gha,scope=new-api-${{ inputs.architecture }},mode=max
          provenance: mode=max
          sbom: true
      - name: Show the exact server deployment command
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo '## Image ready for manual deployment'
            echo "Source commit: $SOURCE_SHA"
            echo "Image tag: $IMAGE:$TAG"
            echo '```bash'
            printf "bash deploy-image.sh deploy '%s@%s'\n" "$IMAGE" "$DIGEST"
            echo '```'
            echo 'Run this command from the existing production application directory.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production through SSH
    needs: publish
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: {}
    steps:
      - name: Deploy the exact published image
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || { echo 'Invalid or missing SSH_HOST'; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535 )) || { echo 'Invalid or missing SSH_PORT'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid or missing SSH_USER'; exit 1; }
          [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo 'Missing SSH key or trusted host key'; exit 1; }
          [[ "$DEPLOY_IMAGE" =~ ^ghcr\.io/lgwtonylgw/new-api@sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid published image reference'; exit 1; }

          umask 077
          KEY_FILE="$RUNNER_TEMP/new-api-deploy-key"
          HOSTS_FILE="$RUNNER_TEMP/new-api-known-hosts"
          trap 'rm -f -- "$KEY_FILE" "$HOSTS_FILE"' EXIT
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$KEY_FILE"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOSTS_FILE"
          ssh -T -i "$KEY_FILE" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOSTS_FILE" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_IMAGE"
