name: Build new-api image for server

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: feature/20261122-develop
        type: string
      architecture:
        description: Match uname -m on the production server
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64

permissions:
  contents: read

concurrency:
  group: new-api-ghcr-publish
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - id: meta
        name: Resolve immutable source revision
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          IMAGE="ghcr.io/${REPOSITORY,,}"
          TAG="sha-${SHA:0:12}-${TARGET_ARCH}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  backend:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
      - name: Vet, build, and test the three Go modules
        run: |
          set -euo pipefail
          mkdir -p web/dist
          touch web/dist/index.html
          for module in . relaykit tokenkit; do
            (cd "$module" && go vet ./... && go build ./...)
          done
          make test

  frontend:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Verify production frontend build
        env:
          VITE_REACT_APP_VERSION: ${{ needs.resolve.outputs.tag }}
        run: bun run build

  publish:
    needs: [resolve, backend, frontend]
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Write build version
        env:
          VERSION: ${{ needs.resolve.outputs.tag }}
        run: printf '%s\n' "$VERSION" > VERSION
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ inputs.architecture }}
          push: true
          tags: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
          cache-from: type=gha,scope=new-api-${{ inputs.architecture }}
          cache-to: type=gha,scope=new-api-${{ inputs.architecture }},mode=max
          provenance: mode=max
          sbom: true
      - name: Show the exact server deployment command
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo '## Image ready for manual deployment'
            echo "Source commit: $SOURCE_SHA"
            echo "Image tag: $IMAGE:$TAG"
            echo '```bash'
            printf "bash deploy-image.sh deploy '%s@%s'\n" "$IMAGE" "$DIGEST"
            echo '```'
            echo 'Run this command from the existing production application directory.'
          } >> "$GITHUB_STEP_SUMMARY"
